name: Atualizar catalogo de WEB Novels
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/build_catalog.py
      - name: Commit catalogo atualizado
        run: |
          git config user.name 'otaku-catalog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add novels-catalog.json
          git diff --cached --quiet || git commit -m 'Atualiza catalogo de WEB novels'
          git push
