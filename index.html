<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Biblioteca Otaku</title>
<style>
:root{--bg:#15131f;--panel:#201d30;--panel2:#2a2640;--tx:#eeeaf8;--mut:#9d97b8;--ac:#4fe0c5;--star:#ffc857;--red:#ff6b8b;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:22px 20px 0;max-width:1200px;margin:auto}
h1{margin:0 0 14px;font:700 28px Georgia,serif;letter-spacing:.3px}
nav{display:flex;gap:6px;border-bottom:1px solid var(--panel2)}
nav button{background:none;border:0;color:var(--mut);padding:10px 16px;font:600 15px inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{max-width:1200px;margin:auto;padding:18px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select{background:var(--panel);color:var(--tx);border:1px solid var(--panel2);border-radius:var(--r);padding:9px 12px;font:inherit}
input[type=search]{flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:var(--panel);color:var(--mut);border:1px solid var(--panel2);border-radius:99px;padding:5px 14px;cursor:pointer;font:inherit}
.chip.on{background:var(--ac);color:#0d2b26;border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--panel);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel2);display:block}
.card .i{padding:8px 10px 10px}
.card .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--mut);font-size:12px;margin-top:3px}
.tag{position:absolute;top:8px;left:8px;background:rgba(21,19,31,.85);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.badge{position:absolute;top:8px;right:8px;background:var(--star);color:#3a2a00;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.badge.g{background:var(--ac);color:#0d2b26}
.msg{color:var(--mut);text-align:center;padding:50px 10px}
.more{display:block;margin:24px auto 0;background:var(--panel2);color:var(--tx);border:0;border-radius:var(--r);padding:10px 26px;font:600 15px inherit;cursor:pointer}
.stats{color:var(--mut);margin-bottom:12px}
#modal{position:fixed;inset:0;background:rgba(8,7,14,.8);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:9}
#modal.on{display:flex}
.box{background:var(--panel);border-radius:14px;max-width:820px;width:100%;display:flex;gap:20px;padding:20px;position:relative}
.box img{width:220px;align-self:flex-start;border-radius:var(--r);flex:none}
.box h2{margin:0 0 4px;font:700 22px Georgia,serif}
.box .sub{color:var(--mut);margin-bottom:10px;font-size:13px}
.syn{max-height:220px;overflow:auto;color:#d5d0e6;margin:10px 0;white-space:pre-line}
.x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.stars{display:flex;gap:2px}
.stars span{font-size:30px;cursor:pointer;color:var(--panel2);line-height:1}
.stars span.on{color:var(--star)}
.btn{border:0;border-radius:var(--r);padding:9px 16px;font:600 14px inherit;cursor:pointer;background:var(--ac);color:#0d2b26}
.btn.d{background:var(--panel2);color:var(--red)}
.gen{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.gen span{background:var(--panel2);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.top h1{margin:0}
#user{display:flex;align-items:center;gap:8px;font-size:14px}#user img{width:28px;height:28px;border-radius:50%}#sync{color:var(--mut);font-size:12px}
.heart{position:absolute;top:34px;left:6px;background:rgba(21,19,31,.85);border:0;color:var(--tx);border-radius:50%;width:30px;height:30px;font-size:17px;cursor:pointer;line-height:1}
.heart.on,#fav.on{color:var(--red)}
.mine{color:var(--star);font-size:12px;font-weight:600;margin-top:2px}
.where{margin-top:14px;border-top:1px solid var(--panel2);padding-top:10px}.where .wh{margin-top:8px}.where small{color:var(--mut);display:block;margin-top:8px}
.lk{background:var(--panel2);color:var(--ac);border-radius:6px;padding:3px 10px;font-size:13px;text-decoration:none}
.lk:hover{background:var(--ac);color:#0d2b26}
.box ol{padding-left:20px;color:#d5d0e6}.box code{background:var(--panel2);padding:1px 6px;border-radius:4px}
@media(max-width:640px){.box{flex-direction:column}.box img{width:150px}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Minha Biblioteca Otaku</h1><div id="user"></div></div>
  <nav>
    <button id="t-search" class="on">Descobrir</button>
    <button id="t-lib">Minha biblioteca (<span id="cnt">0</span>)</button>
  </nav>
</header>
<main>
  <section id="v-search">
    <div class="bar">
      <input type="search" id="q" placeholder="Buscar por título (ou deixe vazio para ver os mais populares)">
      <select id="sort"><option value="POPULARITY_DESC">Mais populares</option><option value="SCORE_DESC">Melhor avaliados</option><option value="TRENDING_DESC">Em alta</option><option value="START_DATE_DESC">Mais recentes</option></select>
    </div>
    <div id="banner" class="stats" style="display:none"></div>
    <div class="chips" id="kinds"></div>
    <div class="grid" id="results"></div>
    <div id="smsg" class="msg"></div>
    <button class="more" id="more" style="display:none">Carregar mais</button>
  </section>

  <section id="v-lib" style="display:none">
    <div class="bar">
      <input type="search" id="lq" placeholder="Buscar na minha biblioteca">
      <select id="lstatus"><option value="">Todos os status</option><option>Quero ver/ler</option><option>Em andamento</option><option>Completo</option><option>Abandonado</option></select>
      <button class="chip" id="lfav">♥ Só favoritos</button><select id="lmin"><option value="0">Qualquer nota</option><option value="2">Minha nota 2+ ★</option><option value="3">Minha nota 3+ ★</option><option value="4">Minha nota 4+ ★</option><option value="5">Minha nota 5 ★</option></select>
      <select id="lsort"><option value="added">Adicionados por último</option><option value="rating">Minha nota</option><option value="title">Título (A–Z)</option></select>
      <button class="btn" id="exp">Exportar</button>
      <button class="btn" id="imp">Importar</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
    <div class="chips" id="lkinds"></div>
    <div class="stats" id="stats"></div>
    <div class="grid" id="libgrid"></div>
  </section>
</main>

<div id="modal"><div class="box" id="box"></div></div>

<script>
const KINDS={all:'Tudo',anime:'Anime',donghua:'Donghua',aeni:'Aeni',manga:'Mangá',manhwa:'Manhwa',manhua:'Manhua'};
const SPEC={anime:['ANIME','JP'],donghua:['ANIME','CN'],aeni:['ANIME','KR'],manga:['MANGA','JP'],manhwa:['MANGA','KR'],manhua:['MANGA','CN']};
const STATUS=['Quero ver/ler','Em andamento','Completo','Abandonado'];
const $=s=>document.querySelector(s);
let src=null,favOnly=false,curOrder=[],lib={},kind='all',lkind='all',page=1,loading=false,current={};

function to5(o){Object.values(o).forEach(l=>{if(l&&l.rating)l.rating=Math.max(1,Math.ceil(l.rating/2))})}
try{lib=JSON.parse(localStorage.getItem('otaku-lib')||'{}');if(localStorage.getItem('otaku-scale')!=='5'){to5(lib);localStorage.setItem('otaku-scale','5')}}catch(e){lib={}}
function save(l){if(l)l.upd=Date.now();try{localStorage.setItem('otaku-lib',JSON.stringify(lib));localStorage.setItem('otaku-del',JSON.stringify(dels))}catch(e){}$('#cnt').textContent=Object.keys(lib).length;schedulePush()}

function kindOf(m){
  const c=m.countryOfOrigin;
  if(m.type==='MANGA') return c==='KR'?'manhwa':(c==='CN'||c==='TW')?'manhua':'manga';
  return c==='CN'||c==='TW'?'donghua':c==='KR'?'aeni':'anime';
}
const title=m=>m.title.english||m.title.romaji||m.title.native;
const clean=t=>(t||'Sem sinopse disponível.').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
function slim(m){return{id:m.id,type:m.type,kind:kindOf(m),title:title(m),native:m.title.native,cover:m.coverImage.large,syn:clean(m.description),genres:m.genres||[],year:m.seasonYear||(m.startDate&&m.startDate.year)||'',eps:m.episodes,ch:m.chapters,vol:m.volumes,avg:m.averageScore,st:m.status}}

function chips(el,cur,fn){
  el.innerHTML=Object.entries(KINDS).map(([k,v])=>`<button class="chip ${k===cur?'on':''}" data-k="${k}">${v}</button>`).join('');
  el.onclick=e=>{const k=e.target.dataset.k;if(k)fn(k)};
}

const GQL=`query($s:String,$t:MediaType,$c:CountryCode,$p:Int,$o:[MediaSort]){Page(page:$p,perPage:24){pageInfo{hasNextPage}media(search:$s,type:$t,countryOfOrigin:$c,sort:$o,isAdult:false){id type countryOfOrigin title{romaji english native}coverImage{large}description(asHtml:false)genres seasonYear startDate{year}episodes chapters volumes averageScore status}}}`;

async function fetchPage(q,k,p,sort){
  const specs=k==='all'?[[undefined,undefined]]:[SPEC[k]];
  const [t,c]=specs[0];
  const v={s:q||undefined,t,c,p,o:q?['SEARCH_MATCH']:[sort]};
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:GQL,variables:v})});
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j||j.errors) throw new Error('API '+r.status+' '+((j&&j.errors&&j.errors[0].message)||''));
  return j.data.Page;
}

async function search(reset){
  if(loading) return; loading=true;
  if(reset){page=1;$('#results').innerHTML='';current={};curOrder=[]}
  $('#smsg').textContent='Carregando...';$('#more').style.display='none';
  try{
    const d=src?await fetchSrc(page):await fetchPage($('#q').value.trim(),kind,page,$('#sort').value);
    const list=(src?d.nodes:d.media).filter(m=>!m.isAdult);
    list.forEach(m=>{const s=slim(m);if(current[s.id])return;current[s.id]=s;curOrder.push(s.id);$('#results').insertAdjacentHTML('beforeend',card(s))});
    $('#smsg').textContent=curOrder.length?'':'Nada encontrado. Tente outro título ou tipo.';
    $('#more').style.display=d.pageInfo.hasNextPage?'block':'none';
  }catch(e){$('#smsg').textContent=(String(e.message).startsWith('API')?'O AniList recusou a busca ('+e.message+'). Tente de novo em instantes.':'Sem conexão com o AniList. Se você abriu este arquivo dentro do Claude, baixe e abra direto no navegador (Chrome, Edge, Firefox). Detalhe: '+e.message)}
  loading=false;
}

function card(s){
  const l=lib[s.id];
  return `<div class="card" data-id="${s.id}" tabindex="0">
    <span class="tag">${KINDS[s.kind]}</span>
    ${l&&l.rating?`<span class="badge">★ ${l.rating}</span>`:l?`<span class="badge g">✓</span>`:''}
    <button class="heart ${l&&l.fav?'on':''}" data-h="${s.id}" aria-label="Favoritar">${l&&l.fav?'♥':'♡'}</button>
    <img loading="lazy" src="${s.cover}" alt="Capa de ${s.title.replace(/"/g,'')}">
    <div class="i"><div class="t">${s.title}</div>
    <div class="m">${s.year||''} ${s.avg?'· AniList '+s.avg/10:''}</div>${l?`<div class="mine">${l.rating?'★'.repeat(l.rating)+'☆'.repeat(5-l.rating):'Sem nota'} · ${l.status}</div>`:''}</div></div>`;
}

const MF='id type countryOfOrigin isAdult title{romaji english native}coverImage{large}description(asHtml:false)genres seasonYear startDate{year}episodes chapters volumes averageScore status';
async function fetchSrc(p){
  if(src.type==='staff'){const d=await gql('query($id:Int,$p:Int){Staff(id:$id){staffMedia(page:$p,perPage:24,sort:POPULARITY_DESC){pageInfo{hasNextPage}nodes{'+MF+'}}}}',{id:src.id,p});return d.Staff.staffMedia}
  const d=await gql('query($id:Int,$p:Int){Studio(id:$id){media(page:$p,perPage:24,sort:POPULARITY_DESC){pageInfo{hasNextPage}nodes{'+MF+'}}}}',{id:src.id,p});return d.Studio.media;
}
function setSrc(v){
  src=v;
  ['.bar','#kinds'].forEach(x=>{const e=$('#v-search '+x);if(e)e.style.display=v?'none':''});
  const b=$('#banner');b.style.display=v?'':'none';
  b.innerHTML=v?`<button class="chip" id="bk">← Voltar</button> <b>Obras de ${v.name}</b> (das mais populares às menos)`:'';
  if(v)$('#bk').onclick=()=>{setSrc(null)};
  search(true);
}
function openWorks(type,id,name){closeModal();tab('s');setSrc({type,id:+id,name})}
function openModal(id){
  const s=lib[id]||current[id]; if(!s) return;
  const l=lib[id]; const stars=l?l.rating||0:0;
  const size=s.type==='MANGA'?[s.ch&&s.ch+' capítulos',s.vol&&s.vol+' volumes']:[s.eps&&s.eps+' episódios'];
  $('#box').innerHTML=`<button class="x" aria-label="Fechar" onclick="closeModal()">×</button>
    <img src="${s.cover}" alt="">
    <div style="flex:1;min-width:0"><h2>${s.title}</h2><button class="chip ${l&&l.fav?'on':''}" id="fav">${l&&l.fav?'♥ Favorito':'♡ Favoritar'}</button>
    <div class="sub">${[KINDS[s.kind],s.year,...size,s.avg&&'Nota AniList '+s.avg/10,s.native].filter(Boolean).join(' · ')}</div>
    <div class="gen">${s.genres.map(g=>`<span>${g}</span>`).join('')}</div>
    <div class="syn" id="syn">${(s.pt||'Traduzindo sinopse para português...').replace(/</g,'&lt;')}</div>
    <button class="chip" id="tg" style="display:none">Ver original (inglês)</button>
    ${l?`<div class="row"><select id="mst">${STATUS.map(x=>`<option ${x===l.status?'selected':''}>${x}</option>`).join('')}</select>
      <input id="mprog" type="number" min="0" style="width:110px" placeholder="${s.type==='MANGA'?'Cap. lido':'Ep. visto'}" value="${l.prog||''}"></div>
      <div class="row"><b>Sua nota:</b><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=stars?'on':''}">★</span>`).join('')}</div><span id="rv">${stars?stars+'/5':'sem nota'}</span></div>
      <textarea id="mnote" rows="2" placeholder="Anotações pessoais" style="width:100%;margin-top:10px;background:var(--panel2);color:var(--tx);border:0;border-radius:8px;padding:8px;font:inherit">${(l.note||'').replace(/</g,'&lt;')}</textarea>
      <div class="row"><button class="btn d" id="rm">Remover da biblioteca</button></div>`
     :`<div class="row"><button class="btn" id="add">Adicionar à biblioteca</button></div>`}
    <div class="where" id="credits"></div>
    <div class="where" id="where">Buscando onde ${s.type==='MANGA'?'ler':'assistir'}...</div>
    </div>`;
  $('#modal').classList.add('on');
  showSyn(id);showWhere(id);$('#fav').onclick=()=>toggleFav(id);
  if(l){
    $('#mst').onchange=e=>{l.status=e.target.value;save(l);refresh()};
    $('#mprog').onchange=e=>{l.prog=e.target.value;save(l)};
    $('#mnote').onchange=e=>{l.note=e.target.value;save(l)};
    $('#stars').onclick=e=>{const n=+e.target.dataset.n;if(!n)return;l.rating=l.rating===n?0:n;if(l.rating&&l.status==='Quero ver/ler'){l.status='Completo'}save(l);openModal(id);refresh()};
    $('#rm').onclick=()=>{delete lib[id];dels[id]=Date.now();save();closeModal();refresh()};
  }else{
    $('#add').onclick=()=>{delete dels[id];lib[id]={...s,status:'Quero ver/ler',rating:0,prog:'',note:'',fav:false,added:Date.now()};save(lib[id]);openModal(id);refresh()};
  }
}
function splitText(t,max){
  const out=[];
  t.split('\n').forEach(par=>{
    if(!par.trim()){out.push('');return}
    let cur='';
    (par.match(/[^.!?]+[.!?]*\s*/g)||[par]).forEach(sn=>{
      while(sn.length>max){ if(cur){out.push(cur);cur=''} out.push(sn.slice(0,max)); sn=sn.slice(max) }
      if((cur+sn).length>max){out.push(cur);cur=sn}else cur+=sn;
    });
    if(cur)out.push(cur);
    out.push('\n');
  });
  return out;
}
async function gtr(c){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q='+encodeURIComponent(c));
  if(!r.ok)throw new Error('g'+r.status);
  const j=await r.json();return j[0].map(x=>x[0]).join('');
}
async function mtr(c){
  const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|pt-BR&q='+encodeURIComponent(c));
  const j=await r.json();
  if(!j.responseData||!j.responseData.translatedText)throw new Error('m');
  return j.responseData.translatedText;
}
async function translate(text){
  let parts;
  try{
    parts=await Promise.all(splitText(text,1500).map(c=>c.trim()?gtr(c):c));
  }catch(e){
    parts=[];
    for(const c of splitText(text,450)) parts.push(c.trim()?await mtr(c):c);
  }
  return parts.join('').replace(/\n{3,}/g,'\n\n').trim();
}
async function showSyn(id){
  const s=lib[id]||current[id];
  const el=$('#syn'),tg=$('#tg');
  if(!s||!el)return;
  if(!s.syn){
    try{const d=await gql('query($id:Int){Media(id:$id){description(asHtml:false)}}',{id:+id});s.syn=clean(d.Media.description);[lib[id],current[id]].forEach(o=>{if(o)o.syn=s.syn})}
    catch(e){s.syn='Sem sinopse disponível.'}
  }
  let pt=s.pt, showPT=true;
  const paint=()=>{
    const el2=$('#syn'); if(!el2||$('#syn').dataset.id!==String(id)&&false)return;
    el2.textContent=showPT?pt:s.syn;
    tg.textContent=showPT?'Ver original (inglês)':'Ver tradução (português)';
  };
  el.dataset.id=id;
  tg.onclick=()=>{showPT=!showPT;paint()};
  if(!pt){
    if(s.syn==='Sem sinopse disponível.'){pt=s.syn}
    else{
      try{pt=await translate(s.syn)}
      catch(e){ if($('#syn')) $('#syn').textContent=s.syn+'\n\n(Não foi possível traduzir agora. Mostrando o texto original.)'; return }
      s.pt=pt; if(lib[id]){lib[id].pt=pt;save()} if(current[id])current[id].pt=pt;
    }
  }
  if($('#syn')&&$('#syn').dataset.id===String(id)){tg.style.display=pt===s.syn?'none':'';paint()}
}

function toggleFav(id){
  let l=lib[id];
  if(!l){const s=current[id];if(!s)return;delete dels[id];l=lib[id]={...s,status:'Quero ver/ler',rating:0,prog:'',note:'',fav:false,added:Date.now()}}
  l.fav=!l.fav;save(l);refresh();
  if($('#modal').classList.contains('on'))openModal(id);
}

/* ---------- onde assistir / ler ---------- */
const TIERS=[['free',/youtube|tubi|pluto|retrocrush|ani-?one|muse/i],['part',/manga ?plus|webtoon|tapas|comikey|shonen jump|viz|bilibili|viki|iqiyi|wetv|tappytoon|lezhin|pocket comics|mangamo|azuki|inkr|k manga|kakao|naver|manta|toomics/i],['paid',/netflix|amazon|prime|disney|hulu|hbo|\bmax\b|hidive|funimation|crunchyroll|apple|kindle|bookwalker|comixology|google play|paramount/i]];
const TNAME={free:'Grátis',part:'Grátis com limites (anúncios ou só alguns capítulos/episódios)',paid:'Pago (assinatura ou compra)',other:'Outros (veja o preço no site)'};
async function gql(q,v){const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:v})});return (await r.json()).data}
async function showWhere(id){
  const s=lib[id]||current[id];if(!s||!$('#where'))return;
  if(!s.links||!s.authors){
    try{
      const d=await gql('query($id:Int){Media(id:$id){siteUrl externalLinks{site url type language isDisabled} staff(perPage:25,sort:RELEVANCE){edges{role node{id name{full}}}} studios{edges{isMain node{id name}}}}}',{id:+id});
      s.links=d.Media.externalLinks.filter(x=>x.type==='STREAMING'&&!x.isDisabled).map(x=>({site:x.site,url:x.url,lang:x.language}));
      s.page=d.Media.siteUrl;
      const seen={};
      s.authors=d.Media.staff.edges.filter(e=>/^(original|story|art$|creator)/i.test(e.role)&&!seen[e.node.id]&&(seen[e.node.id]=1)).slice(0,5).map(e=>({id:e.node.id,name:e.node.name.full,role:e.role}));
      s.studios=d.Media.studios.edges.filter(e=>e.isMain).map(e=>({id:e.node.id,name:e.node.name}));
      [lib[id],current[id]].forEach(o=>{if(o)Object.assign(o,{links:s.links,page:s.page,authors:s.authors,studios:s.studios})});
      if(lib[id])save();
    }catch(e){s.links=s.links||[];s.authors=s.authors||[];s.studios=s.studios||[]}
  }
  const cr=$('#credits');
  if(cr){
    const RL={'Original Creator':'Criador original','Original Story':'História original','Story & Art':'História e arte','Story':'História','Art':'Arte','Creator':'Criador'};
    const btn=(t,x,extra)=>`<button class="lk" style="border:0;cursor:pointer" data-t="${t}" data-id="${x.id}" data-n="${x.name.replace(/"/g,'&quot;')}">${x.name}${extra||''}</button>`;
    let h='';
    if(s.authors.length)h+=`<div class="wh"><b>${s.type==='MANGA'?'Autor e criador':'Criador e autor original'}</b><div class="gen">${s.authors.map(a=>btn('staff',a,' ('+(RL[a.role]||a.role)+')')).join('')}</div></div>`;
    if(s.type!=='MANGA'&&s.studios.length)h+=`<div class="wh"><b>Estúdio</b><div class="gen">${s.studios.map(x=>btn('studio',x)).join('')}</div></div>`;
    if(h)h+='<small>Toque em um nome para ver todas as obras.</small>';
    cr.innerHTML=h;cr.style.display=h?'':'none';
    cr.onclick=e=>{const b=e.target.closest('button');if(b)openWorks(b.dataset.t,b.dataset.id,b.dataset.n)};
  }
  const el=$('#where');if(!el)return;
  const g={free:[],part:[],paid:[],other:[]};
  s.links.forEach(x=>{const t=TIERS.find(t=>t[1].test(x.site));g[t?t[0]:'other'].push(x)});
  const verb=s.type==='MANGA'?'Onde ler':'Onde assistir';
  let h=`<b>${verb}</b>`;
  h+=s.links.length?Object.keys(g).filter(k=>g[k].length).map(k=>`<div class="wh"><small style="margin:0">${TNAME[k]}</small><div class="gen">${g[k].map(x=>`<a class="lk" target="_blank" rel="noopener" href="${x.url}">${x.site}${/portug/i.test(x.lang||'')?' 🇧🇷':''}</a>`).join('')}</div></div>`).join(''):'<div class="wh">O AniList não lista serviços oficiais para este título.</div>';
  const q=encodeURIComponent(s.title);
  h+=`<div class="wh"><small style="margin:0">Mais opções</small><div class="gen">${s.type==='MANGA'?'':`<a class="lk" target="_blank" rel="noopener" href="https://www.justwatch.com/br/busca?q=${q}">JustWatch Brasil</a>`}<a class="lk" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(s.title+(s.type==='MANGA'?' ler oficial':' assistir oficial'))}">Buscar no Google</a>${s.page?`<a class="lk" target="_blank" rel="noopener" href="${s.page}">Página no AniList</a>`:''}</div></div>`;
  h+='<small>Classificação aproximada. O catálogo e os preços mudam por país; confirme no site. 🇧🇷 = versão em português.</small>';
  el.innerHTML=h;
}

/* ---------- sincronização por código (JSONBlob, sem conta) ---------- */
const JB='https://jsonblob.com/api/jsonBlob';
let code='',ready=false,pushT,dels={};
try{code=localStorage.getItem('otaku-code')||'';dels=JSON.parse(localStorage.getItem('otaku-del')||'{}')}catch(e){}
const payload=()=>JSON.stringify({scale:5,items:Object.fromEntries(Object.entries(lib).map(([k,v])=>{const {syn,pt,links,page,authors,studios,...r}=v;return[k,r]})),del:dels});
function setStatus(t){const e=$('#sync');if(e)e.textContent=t}
function renderUser(){$('#user').innerHTML=`<span id="sync">${code?'Sincronizado ✓':''}</span><button class="btn" id="sbtn">Sincronizar aparelhos</button>`}
$('#user').onclick=e=>{if(e.target.id==='sbtn')showSync()};
function schedulePush(){if(!code||!ready)return;clearTimeout(pushT);pushT=setTimeout(push,2000)}
async function push(){
  try{setStatus('Salvando...');
    const r=await fetch(JB+'/'+code,{method:'PUT',headers:{'Content-Type':'application/json',Accept:'application/json'},body:payload()});
    if(!r.ok)throw new Error(r.status);setStatus('Sincronizado ✓')}
  catch(e){setStatus('Erro ao salvar na nuvem')}
}
async function pullSync(){
  setStatus('Sincronizando...');
  const r=await fetch(JB+'/'+code,{headers:{Accept:'application/json'}});
  if(!r.ok)throw new Error(r.status);
  const c=await r.json();
  if(c.scale!==5)to5(c.items||{});
  Object.entries(c.del||{}).forEach(([k,t])=>{dels[k]=Math.max(dels[k]||0,t);if(lib[k]&&(lib[k].upd||0)<t)delete lib[k]});
  Object.entries(c.items||{}).forEach(([k,v])=>{if(dels[k]&&dels[k]>(v.upd||0))return;if(!lib[k]||(v.upd||0)>(lib[k].upd||0))lib[k]={...lib[k],...v}});
  ready=true;save();refresh();setStatus('Sincronizado ✓');
}
function startSync(){if(code)pullSync().catch(()=>setStatus('Sem conexão com a nuvem'))}
function showSync(){
  $('#box').innerHTML=`<button class="x" aria-label="Fechar" onclick="closeModal()">×</button><div style="flex:1">
  <h2>Sincronizar aparelhos</h2>
  ${code?`<p class="sub">Seu código de sincronização:</p><p><code style="font-size:15px;word-break:break-all">${code}</code></p>
    <p class="sub">Em outro aparelho, toque em "Sincronizar aparelhos" e cole este código. Quem tiver o código consegue ver e alterar sua lista, então não compartilhe.</p>
    <div class="row"><button class="btn" id="cp">Copiar código</button><button class="btn" id="now">Sincronizar agora</button><button class="btn d" id="off">Desconectar</button></div>`
  :`<p class="sub">Guarde sua lista na nuvem e abra em qualquer aparelho com um código, sem criar conta.</p>
    <div class="row"><button class="btn" id="mk">Criar código com a minha lista</button></div>
    <p class="sub" style="margin-top:16px">Já tem um código de outro aparelho?</p>
    <div class="row"><input id="ci" placeholder="Cole o código aqui" style="flex:1"><button class="btn" id="cn">Conectar</button></div>`}
  <p id="ss" class="sub"></p>
  <p class="sub">A lista fica guardada num serviço gratuito de terceiros (JSONBlob). Sem capas grandes nem sinopses, só seus dados. Faça Exportar de vez em quando como backup.</p></div>`;
  $('#modal').classList.add('on');
  const say=t=>{$('#ss').textContent=t};
  const done=()=>{localStorage.setItem('otaku-code',code);renderUser();showSync()};
  if(code){
    $('#cp').onclick=()=>{navigator.clipboard.writeText(code).then(()=>say('Código copiado.'),()=>say('Copie o código manualmente.'))};
    $('#now').onclick=()=>{say('Sincronizando...');pullSync().then(()=>say('Pronto.'),()=>say('Não foi possível sincronizar. Verifique a internet.'))};
    $('#off').onclick=()=>{code='';ready=false;localStorage.removeItem('otaku-code');renderUser();showSync()};
  }else{
    $('#mk').onclick=async()=>{
      say('Criando...');
      try{const r=await fetch(JB,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:payload()});
        if(!r.ok)throw new Error(r.status);
        const loc=r.headers.get('Location')||r.headers.get('X-jsonblob')||'';
        if(!loc)throw new Error('o navegador não conseguiu ler o código devolvido pelo serviço (CORS)');
        code=loc.split('/').pop();ready=true;done()}
      catch(e){say('Não foi possível criar o código. Motivo: '+(e.message==='Failed to fetch'?'sem conexão com o serviço JSONBlob (rede bloqueada, serviço fora do ar, ou você abriu o arquivo dentro do Claude)':e.message)+'. Enquanto isso, use Exportar e Importar na aba Minha biblioteca.')}
    };
    $('#cn').onclick=()=>{
      const c=$('#ci').value.trim();
      if(!/^[\w-]{8,}$/.test(c)){say('Código inválido.');return}
      code=c;say('Conectando...');
      pullSync().then(done,()=>{code='';say('Código não encontrado ou sem conexão.')});
    };
  }
}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.onkeydown=e=>{if(e.key==='Escape')closeModal()};

function clickCard(e){const h=e.target.closest('.heart');if(h){toggleFav(+h.dataset.h);return}const c=e.target.closest('.card');if(c)openModal(c.dataset.id)}
$('#results').onclick=clickCard;$('#libgrid').onclick=clickCard;

function refresh(){
  $('#results').innerHTML=curOrder.map(i=>card(current[i])).join('');
  renderLib();
}

function renderLib(){
  const q=$('#lq').value.toLowerCase(),st=$('#lstatus').value,so=$('#lsort').value;
  let items=Object.values(lib).filter(s=>(lkind==='all'||s.kind===lkind)&&(!st||s.status===st)&&(!favOnly||s.fav)&&(!(+$('#lmin').value)||(s.rating||0)>=+$('#lmin').value)&&(!q||(s.title+' '+(s.native||'')).toLowerCase().includes(q)));
  items.sort((a,b)=>so==='rating'?(b.rating||0)-(a.rating||0):so==='title'?a.title.localeCompare(b.title):b.added-a.added);
  const rated=items.filter(s=>s.rating);
  const avg=rated.length?(rated.reduce((a,s)=>a+s.rating,0)/rated.length).toFixed(1):'–';
  $('#stats').textContent=`${items.length} título(s) · ${items.filter(s=>s.status==='Completo').length} completos · sua média: ${avg}`;
  $('#libgrid').innerHTML=items.length?items.map(card).join(''):'';
  if(!items.length) $('#libgrid').innerHTML='<div class="msg" style="grid-column:1/-1">Nada aqui ainda. Vá em Descobrir, abra um título e toque em “Adicionar à biblioteca”.</div>';
  chips($('#lkinds'),lkind,k=>{lkind=k;renderLib()});
}

function tab(t){
  $('#v-search').style.display=t==='s'?'':'none';$('#v-lib').style.display=t==='l'?'':'none';
  $('#t-search').classList.toggle('on',t==='s');$('#t-lib').classList.toggle('on',t==='l');
  if(t==='l')renderLib();
}
$('#t-search').onclick=()=>tab('s');$('#t-lib').onclick=()=>tab('l');

let tm;
$('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>search(true),450)};
$('#sort').onchange=()=>search(true);
$('#more').onclick=()=>{page++;search(false)};
['#lq','#lstatus','#lsort','#lmin'].forEach(s=>$(s).oninput=renderLib);
$('#lfav').onclick=e=>{favOnly=!favOnly;e.target.classList.toggle('on',favOnly);renderLib()};

$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(lib)],{type:'application/json'}));a.download='minha-biblioteca.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{{const o=JSON.parse(r.result);if(Object.values(o).some(l=>l.rating>5))to5(o);Object.assign(lib,o)}save();renderLib()}catch(x){alert('Arquivo inválido.')}};r.readAsText(f)};

(function init(){
  const f=k=>{kind=k;chips($('#kinds'),kind,f);search(true)};
  chips($('#kinds'),kind,f);save();renderUser();startSync();search(true);
})();
</script>
