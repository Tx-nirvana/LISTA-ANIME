name: Atualizar catalogo de WEB Novels

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Coletar catalogos
        run: python scripts/build_catalog.py

      - name: Salvar catalogo atualizado
        run: |
          git config user.name "otaku-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add novels-catalog.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no catalogo."
          else
            git commit -m "Atualiza catalogo de WEB novels"
            git push
          fi
